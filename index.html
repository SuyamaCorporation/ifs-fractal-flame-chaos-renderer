<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFS Fractal Flame Chaos Renderer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#000; color:#e2e8f0; font-family:system-ui,sans-serif; }
  #fractalCanvas { border-radius:8px; display:block; cursor:grab; }
  #fractalCanvas:active { cursor:grabbing; }
  .ctrl { background:rgba(15,23,42,0.95); border:1px solid #334155; border-radius:12px; padding:14px; }
  label { font-size:11px; color:#94a3b8; display:block; margin-bottom:2px; }
  input[type=range] { width:100%; accent-color:#f97316; }
  select { background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:6px; padding:3px 6px; font-size:12px; width:100%; }
  .btn { background:#1e293b; color:#e2e8f0; border:1px solid #334155; border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; transition:all 0.15s; }
  .btn:hover { background:#334155; }
  input[type=number] { background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:6px; padding:3px 5px; font-size:11px; width:60px; }
</style>
</head>
<body class="min-h-screen p-4">
<div class="max-w-5xl mx-auto">
  <h1 class="text-2xl font-bold text-center text-orange-300 mb-1">🔥 IFS Fractal Flame Chaos Renderer</h1>
  <p class="text-gray-400 text-sm text-center mb-4">Chaos game • Color stealing • Drag to pan • Scroll to zoom</p>

  <div class="flex flex-col lg:flex-row gap-4">
    <!-- Canvas -->
    <div class="flex-1 flex flex-col items-center">
      <canvas id="fractalCanvas" width="480" height="480" aria-label="IFS fractal flame rendering canvas"></canvas>
      <div class="mt-2 text-xs text-gray-500" id="renderInfo">Iterations: 0 | Render: 0ms</div>
    </div>

    <!-- Controls -->
    <div class="ctrl w-full lg:w-72 space-y-3">
      <div>
        <label for="iterSlider">Iterations: <span id="iterVal">200000</span></label>
        <input type="range" id="iterSlider" min="10000" max="1000000" step="10000" value="200000" aria-label="Iteration count">
      </div>
      <div>
        <label for="zoomSlider">Zoom: <span id="zoomVal">1.0×</span></label>
        <input type="range" id="zoomSlider" min="0.5" max="4" step="0.1" value="1" aria-label="Zoom level">
      </div>
      <div>
        <label for="paletteSelect">Palette:</label>
        <select id="paletteSelect" aria-label="Color palette">
          <option value="fire">🔥 Fire</option>
          <option value="ice">🧊 Ice</option>
          <option value="rainbow">🌈 Rainbow</option>
          <option value="gold">✨ Gold</option>
          <option value="neon">💜 Neon</option>
          <option value="grayscale">⚪ Grayscale</option>
        </select>
      </div>

      <!-- Transform editors (4 transforms) -->
      <div id="transformEditor" class="space-y-2">
        <div class="text-xs font-semibold text-orange-300">Transforms (a b c d e f | weight)</div>
      </div>

      <div class="flex flex-wrap gap-2 pt-2">
        <button class="btn flex-1" onclick="randomizeTransforms()" aria-label="Randomize transforms">🎲 Randomize</button>
        <button class="btn flex-1" onclick="resetToDefaults()" aria-label="Reset to defaults">↺ Defaults</button>
        <button class="btn flex-1" onclick="renderFractal()" aria-label="Render fractal">▶ Render</button>
        <button class="btn flex-1" onclick="downloadPNG()" aria-label="Download PNG">💾 Save PNG</button>
      </div>
    </div>
  </div>
</div>

<script>
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

const canvas = document.getElementById('fractalCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Transforms: [a,b,c,d,e,f,weight,colorIndex(0-1)]
let transforms = [
  [0.85, 0.04, -0.04, 0.85, 0.0, 1.6, 0.73, 0.0],
  [0.20,-0.26,  0.23, 0.22, 0.0, 1.6, 0.13, 0.25],
  [-0.15, 0.28, 0.26, 0.24, 0.0, 0.44,0.07, 0.5],
  [0.0,  0.0,   0.0,  0.16, 0.0, 0.0, 0.07, 0.75],
];

let zoom = 1, panX = 0, panY = 0;
let palette = 'fire';
let iters = 200000;

// Palettes
function getPalette(name, t) {
  // t in [0,1]
  switch(name) {
    case 'fire': {
      const r = Math.min(255, t*255*3);
      const g = Math.max(0, Math.min(255, (t-0.33)*255*3));
      const b = Math.max(0, Math.min(255, (t-0.66)*255*3));
      return [r,g,b];
    }
    case 'ice': return [Math.floor(t*100),Math.floor(t*200),Math.floor(255*Math.min(1,t*1.5))];
    case 'rainbow': {
      const h = t*360;
      const [r,g,b] = hslToRgb(h,1,0.6);
      return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];
    }
    case 'gold': return [Math.floor(255*Math.min(1,t*2)),Math.floor(200*t),0];
    case 'neon': {
      const h = (t*200+260)%360;
      const [r,g,b] = hslToRgb(h,1,0.6);
      return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];
    }
    case 'grayscale': { const v=Math.floor(t*255); return [v,v,v]; }
    default: return [255,255,255];
  }
}

function hslToRgb(h,s,l){
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return [r+m,g+m,b+m];
}

function renderFractal() {
  const t0 = performance.now();
  const accumR = new Float32Array(W*H);
  const accumG = new Float32Array(W*H);
  const accumB = new Float32Array(W*H);
  const accumN = new Float32Array(W*H);

  const weights = transforms.map(t=>t[6]);
  const totalW = weights.reduce((a,b)=>a+b,0);
  const cumW = [];
  let csum = 0;
  weights.forEach(w => { csum += w/totalW; cumW.push(csum); });

  let x = Math.random()*2-1, y = Math.random()*2-1;
  let c = Math.random();

  const scale = 60 * zoom;
  const cx = W/2 + panX, cy = H/2 + panY;

  for (let i = 0; i < iters; i++) {
    // Pick transform
    const r = Math.random();
    let ti = 0;
    for (let j = 0; j < cumW.length; j++) { if (r < cumW[j]) { ti = j; break; } }
    const [a,b,cc,d,e,f,,ci] = transforms[ti];
    const nx = a*x + b*y + e;
    const ny = cc*x + d*y + f;
    c = (c + ci) * 0.5;
    x = nx; y = ny;

    if (i < 20) continue; // Warm up
    const px = Math.floor(x*scale + cx);
    const py = Math.floor(-y*scale + cy);
    if (px<0||px>=W||py<0||py>=H) continue;
    const idx = py*W+px;
    const [pr,pg,pb] = getPalette(palette, c);
    accumR[idx] += pr;
    accumG[idx] += pg;
    accumB[idx] += pb;
    accumN[idx]++;
  }

  // Log-density display
  const imgData = ctx.createImageData(W,H);
  let maxLog = 0;
  const logN = new Float32Array(W*H);
  for (let i=0;i<W*H;i++) {
    if (accumN[i]>0) { logN[i]=Math.log(accumN[i]+1); if(logN[i]>maxLog)maxLog=logN[i]; }
  }
  for (let i=0;i<W*H;i++) {
    const base = i*4;
    if (accumN[i]===0) { imgData.data[base+3]=255; continue; }
    const alpha = logN[i]/maxLog;
    const n = accumN[i];
    imgData.data[base]   = Math.min(255, Math.floor(accumR[i]/n*alpha));
    imgData.data[base+1] = Math.min(255, Math.floor(accumG[i]/n*alpha));
    imgData.data[base+2] = Math.min(255, Math.floor(accumB[i]/n*alpha));
    imgData.data[base+3] = 255;
  }
  ctx.putImageData(imgData, 0, 0);
  const elapsed = (performance.now()-t0).toFixed(0);
  document.getElementById('renderInfo').textContent = `Iterations: ${iters.toLocaleString()} | Render: ${elapsed}ms`;
}

// Transform editor
function buildEditor() {
  const container = document.getElementById('transformEditor');
  container.innerHTML = '<div class="text-xs font-semibold text-orange-300">Transforms (a b c d e f | weight)</div>';
  transforms.forEach((tr, idx) => {
    const row = document.createElement('div');
    row.className = 'bg-gray-900 rounded-lg p-2 text-xs';
    const labels = ['a','b','c','d','e','f','w'];
    row.innerHTML = `<div class="text-orange-400 font-semibold mb-1">T${idx+1}</div>
    <div class="flex flex-wrap gap-1">
      ${labels.map((l,i) => `<label class="flex flex-col items-center"><span class="text-gray-500">${escapeHtml(l)}</span><input type="number" step="0.01" value="${escapeHtml(String(tr[i].toFixed(2)))}" data-t="${idx}" data-i="${i}" class="w-14 text-center" aria-label="Transform ${idx+1} coefficient ${l}"></label>`).join('')}
    </div>`;
    container.appendChild(row);
  });
  container.querySelectorAll('input[type=number]').forEach(inp => {
    inp.addEventListener('change', function() {
      transforms[parseInt(this.dataset.t)][parseInt(this.dataset.i)] = parseFloat(this.value) || 0;
    });
  });
}

function randomizeTransforms() {
  transforms = Array.from({length:4}, (_,i) => {
    const a = (Math.random()-0.5)*1.5, b=(Math.random()-0.5)*0.5, c=(Math.random()-0.5)*0.5;
    const d=(Math.random()-0.5)*1.5, e=(Math.random()-0.5)*1, f=(Math.random()-0.5)*2;
    // Ensure contractive (det < 1)
    const det = Math.abs(a*d-b*c);
    const sf = det>0.9 ? 0.8/Math.sqrt(det) : 1;
    return [a*sf,b*sf,c*sf,d*sf,e,f,0.1+Math.random()*0.4,i/4];
  });
  buildEditor();
  renderFractal();
}

function resetToDefaults() {
  transforms = [
    [0.85,0.04,-0.04,0.85,0.0,1.6,0.73,0.0],
    [0.20,-0.26,0.23,0.22,0.0,1.6,0.13,0.25],
    [-0.15,0.28,0.26,0.24,0.0,0.44,0.07,0.5],
    [0.0,0.0,0.0,0.16,0.0,0.0,0.07,0.75],
  ];
  zoom=1; panX=0; panY=0;
  document.getElementById('zoomSlider').value=1;
  document.getElementById('zoomVal').textContent='1.0×';
  buildEditor();
  renderFractal();
}

function downloadPNG() {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'fractal-flame.png';
  a.click();
}

// Controls
document.getElementById('iterSlider').addEventListener('input', function() {
  iters = parseInt(this.value);
  document.getElementById('iterVal').textContent = parseInt(this.value).toLocaleString();
});
document.getElementById('iterSlider').addEventListener('change', renderFractal);

document.getElementById('zoomSlider').addEventListener('input', function() {
  zoom = parseFloat(this.value);
  document.getElementById('zoomVal').textContent = zoom.toFixed(1)+'×';
  renderFractal();
});
document.getElementById('paletteSelect').addEventListener('change', function() {
  palette = this.value;
  renderFractal();
});

// Pan with drag
let dragging=false, lastMX=0,lastMY=0;
canvas.addEventListener('mousedown', e => { dragging=true; lastMX=e.clientX; lastMY=e.clientY; });
window.addEventListener('mousemove', e => {
  if(!dragging) return;
  panX += e.clientX-lastMX; panY += e.clientY-lastMY;
  lastMX=e.clientX; lastMY=e.clientY;
});
window.addEventListener('mouseup', () => { if(dragging){dragging=false; renderFractal();} });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.5, Math.min(4, zoom + (e.deltaY<0?0.1:-0.1)));
  document.getElementById('zoomSlider').value = zoom;
  document.getElementById('zoomVal').textContent = zoom.toFixed(1)+'×';
  renderFractal();
}, {passive:false});

buildEditor();
renderFractal();
</script>
</body>
</html>
